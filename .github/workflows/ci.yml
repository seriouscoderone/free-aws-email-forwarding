name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Synthesize stack
        run: |
          cp config.example.json config.json
          npx cdk synth --quiet
